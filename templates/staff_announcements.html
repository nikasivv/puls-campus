{% extends 'base.html' %}{% block title %}Объявления · Деканат{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">ДЕКАНАТ / СООБЩЕНИЯ</span><h1>Сообщения студентам<span class="accent-dot">.</span></h1><p>Сообщение получает конкретный студент, группа или все обучающиеся. Оно появляется в колокольчике.</p></div><section class="panel narrow-panel"><div class="section-heading"><h2>Новое объявление</h2></div><form class="request-form" method="post" action="{{ url_for('staff_notice') }}"><input type="hidden" name="_csrf" value="{{ session['_csrf'] }}"><label for="recipient">Получатели</label><select id="recipient" name="user_id"><option value="all">Все студенты</option>{% for group in groups %}<option value="group:{{ group['name'] }}">Группа {{ group['name'] }}</option>{% endfor %}{% for u in students %}<option value="{{ u['id'] }}">{{ u['full_name'] }} · {{ u['group_name'] }}</option>{% endfor %}</select><label for="notice-title">Тема</label><input id="notice-title" name="title" minlength="3" maxlength="100" required><label for="notice-body">Текст сообщения</label><textarea id="notice-body" name="body" minlength="5" maxlength="500" rows="5" required></textarea><button class="btn primary">Опубликовать сообщение</button></form></section>{% endblock %}
